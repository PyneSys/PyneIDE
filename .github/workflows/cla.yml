name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      # contributor-assistant/github-action is archived upstream, so the action
      # is pinned to the v2.6.1 commit rather than a moving tag.
      - name: Check or sign the CLA
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/PyneSys/PyneIDE/blob/main/CLA.md'
          branch: 'main'
          allowlist: wallneradam,bot*
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: 'Thanks for your pull request. PyneIDE asks contributors to sign a Contributor License Agreement, so that contributed code can also be used in non-GPL PyneSys products — the [CLA](https://github.com/PyneSys/PyneIDE/blob/main/CLA.md) explains why, and you keep the copyright to your work. Please read it, then post the following as a comment on this pull request:'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thanks!'
          lock-pullrequest-aftermerge: false
