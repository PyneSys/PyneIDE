name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
  workflow_call:

permissions:
  contents: read

# A newer push to the same ref supersedes the previous run. The daily run has
# its own group, so it never cancels a push run on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The daily run only watches the latest PyneCore release; the build is
    # covered by every push.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:data-select
      - run: npm run test:grammar
      - run: npm run test:report
      - run: npm run test:agent-skills
      - run: npm run test:release
      - run: npm run test:project-env
      - run: python3 -m unittest discover -s test -p marketplace_test.py
      - run: npx vsce package --out pyneide.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: pyneide-vsix
          path: pyneide.vsix
          # Default is 90 days; every CI run kept a ~5 MB VSIX that long, which
          # alone consumed a large share of the Actions storage quota.
          retention-days: 7

  env-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 6.12.1 is the oldest supported Core: a released package that only an
        # IDE change can break, so the daily run tests the latest release alone.
        core: ${{ github.event_name == 'schedule' && fromJSON('["latest"]') || fromJSON('["6.12.1", "latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:download
      - run: npm run test:env
        env:
          PYNEIDE_TEST_CORE: ${{ matrix.core }}
