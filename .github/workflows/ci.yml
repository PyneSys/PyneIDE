name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:grammar
      - run: npx vsce package --skip-license --out pyneide.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: pyneide-vsix
          path: pyneide.vsix
